name: Build and Release Portable

on:
  push:

permissions:
  contents: write

jobs:
  release-portable:
    name: Build & Release Portable Windows
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Embed publik app token
        # The token is a publishable identifier (it ships in the binary); it lets
        # the publik API gateway attribute this install to cue and rate-limit
        # minting. It is NOT a pk_ key and holds no balance. Written into src/,
        # which the electron-builder.cjs files allowlist already packages.
        # Fails closed: a release without it would ship a build whose provider
        # picker silently lacks the publik option.
        shell: bash
        env:
          PUBLIK_APP_TOKEN: ${{ secrets.PUBLIK_APP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PUBLIK_APP_TOKEN" || { echo "PUBLIK_APP_TOKEN secret is not set"; exit 1; }
          node -e '
            const fs = require("fs"); const p = "src/publik-build.json";
            const cfg = JSON.parse(fs.readFileSync(p, "utf8"));
            cfg.appToken = process.env.PUBLIK_APP_TOKEN;
            fs.writeFileSync(p, JSON.stringify(cfg, null, 2) + "\n");
          '
          node -e 'const c = require("./src/publik-build.json"); if (!c.appToken) process.exit(1); console.log("publik app token embedded for", c.appSlug)'

      - name: Build Portable Windows Executable
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Portable Executable
        shell: bash
        run: |
          if [ ! -f "dist/cue-win-x64.exe" ]; then
            echo "Error: dist/cue-win-x64.exe was not created." >&2
            exit 1
          fi
          echo "Portable executable created successfully:"
          ls -lh dist/cue-win-x64.exe

      - name: Determine Release Tag and Name
        id: vars
        shell: bash
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
            REL_NAME="Cue Portable ${TAG_NAME}"
          else
            TAG_NAME="v${PKG_VER}-${SHORT_SHA}"
            REL_NAME="Cue Portable v${PKG_VER} (${SHORT_SHA})"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_name=${REL_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cue-win-x64-${{ github.sha }}
          path: dist/cue-win-x64.exe
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          files: dist/cue-win-x64.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
